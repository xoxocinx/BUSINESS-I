<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Business I — Accounting Reviewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

*{box-sizing:border-box}html,body{margin:0}body{font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:#fff;min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,18,48,.92);backdrop-filter:blur(8px);padding:10px 12px}

nav button{flex:1;white-space:nowrap;border:0;border-radius:999px;padding:9px 14px;background:#22307a;color:#fff;font-weight:600;cursor:pointer}
nav button.on{background:linear-gradient(90deg,var(--pr),var(--pu))}
main{max-width:860px;margin:auto;padding:14px 12px 60px}.view{display:none;animation:in .3s}.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.card{background:var(--card);color:var(--tx);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{text-align:center}.stat b{font-size:1.9rem;display:block;color:var(--pr)}
.bar{height:10px;border-radius:9px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pu));transition:width .4s}
button.b{border:0;border-radius:12px;padding:11px 16px;font-weight:700;color:#fff;background:var(--pr);cursor:pointer;margin:4px 4px 4px 0;font-size:.95rem}
button.b.g{background:var(--ok)}button.b.r{background:var(--no)}button.b.s{background:var(--pu)}button.b.o{background:transparent;color:var(--pr);border:2px solid var(--pr)}
details{background:var(--card);color:var(--tx);border-radius:16px;margin:10px 0;box-shadow:0 6px 18px rgba(0,0,0,.2)}summary{padding:14px 16px;font-weight:700;cursor:pointer}
.body{padding:0 16px 14px}.it{border-top:1px solid var(--ln);padding:10px 0}.it b{color:var(--pr)}
.note{background:rgba(124,92,255,.12);border-left:4px solid var(--pu);padding:8px 10px;border-radius:8px;margin-top:6px;font-size:.9rem}
h3.l{color:#c9d2ff;margin:20px 4px 0}select,input[type=text]{width:100%;padding:11px;border-radius:10px;border:2px solid var(--ln);font-size:1rem;background:var(--card);color:var(--tx)}
.fc{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;font-size:1.1rem;user-select:none}
.fc small{color:var(--mu);margin-bottom:8px}.fc .a{font-size:1.5rem;font-weight:800;color:var(--pr)}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:12px;border-radius:12px;border:2px solid var(--ln);background:transparent;color:var(--tx);font-size:1rem;cursor:pointer}
.opt.sel{border-color:var(--pr);background:rgba(58,91,255,.12)}.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.15)}.opt.no{border-color:var(--no);background:rgba(220,38,38,.15)}
.fb{padding:10px;border-radius:10px;margin-top:10px}.fb.ok{background:rgba(22,163,74,.15)}.fb.no{background:rgba(220,38,38,.15)}
.mm{display:flex;gap:8px;align-items:center;margin:8px 0}.mm span{flex:1}.mm select{width:70px}.muted{color:var(--mu);font-size:.9rem}
</style></head><body>

<script>
// ===== ORIGINAL LESSON (wording preserved; optional [2]=clarification, [3]=card clue) =====
const L=[
["BUSINESS I — ACCOUNTING","ACCOUNTING",[
["ACCOUNTING",`Part of our daily life. It helps businesses record, organize, and communicate financial information.`]]],
["BUSINESS I — ACCOUNTING","PROCESS",[
["IDENTIFYING",`Selection of the economic events which are important to a particular business transaction.`],
["RECORDING",`Act of keeping chronological records of events that are measurable in accounting document like journals and ledgers.`],
["COMMUNICATING",`Through the preparation and distribution of financial and other accounting reports.`],
["Economic Event",`Whole purchase of materials, sale of goods, and acquisition of machine, which are measured in monetary terms and are recorded in the financial statements.`]]],
["BUSINESS I — ACCOUNTING","PURPOSE, NATURE and ROLES",[
["PURPOSE",`To help end-users see the true picture of the business in financial terms. Must be understandable, relevant, and for general-purpose.`],
["NATURE",`accounting is a discipline that observes professional standards and professional ethics.`],
["Service Activity",`Accounting not involved in the selling of goods. Instead, it is involved in providing professional services.`],
["Art and Science",`To perform its service activity with utmost efficiency and in the best possible manner without and wastage of time and money.`,`Typo: "without and wastage" should read "without any wastage".`],
["The Language of the Business",`Serves as a means of communication.`],
["The Eyes of the Business",`Bookkeeping records.`]]],
["BUSINESS I — ACCOUNTING","HISTORY — Evolution of Accounting",[
["The Cradle of Civilization (3600 B.C)",`record keeping was done through "Clay Tablets"`],
["Double-entry Bookkeeping System (14th Century)",`most relevant event by Fra Luca Bartolomeo De Pacioli or Luca Pacioli`,`Luca Pacioli is known as the "Father of Accounting".`],
["Summa De Arithmetica",`was a work written by Luca Pacioli.`]]],
["LESSON 2 — ACCOUNTING CONCEPTS AND PRINCIPLES","GAAP and Entity / Going Concern",[
["GAAP (Generally accepted accounting)",`approved accounting methods and practices`,`GAAP = Generally Accepted Accounting Principles.`],
["Business Entity Principle",`is a separate and distinct from its owner or investor.\nTransactions associated with a business must be separately recorded from those of its owners or other businesses.`],
["Going Concern Principle",`Business is expected to continue indefinitely.\naccounting term for a company that is financially stable enough to meet its obligations and continue its business fkr the foreseeable future.`,`Typo: "fkr" = "for".`]]],
["LESSON 2 — ACCOUNTING CONCEPTS AND PRINCIPLES","Time, Money, Evidence and Cost",[
["Time Period Principle",`Financial statements are to be divided into specific time intervals.\nMonthly, quarterly, annually, or yearly.`],
["Monetary Unit Principle",`Amounts are stated into a single monetary unit.\nanything that is non-quantifiable should not be recorded a business' financial accounts.`,`Clarification: "recorded in a business' financial accounts".`],
["Objectivity Principle",`Financial statements must be presented with supporting evidence.\nStates that the financial statements a company produces must be based on solid evidence.`],
["Cost Principle",`Accounts should be recorded initially at cost.\nitems need to be recorded as the actual price paid\nis equal to the amount paid for each transaction.`]]],
["LESSON 2 — ACCOUNTING CONCEPTS AND PRINCIPLES","Accrual, Matching, Disclosure, Conservatism",[
["Accrual Accounting Principle",`is an accounting concept that requires transactions to be recorded in the time period in which they occur\nregardless when the actual flows for the transaction are received.`,`Clarification: "actual cash flows" (cash received or paid).`],
["Matching Principle",`requires that revenues and any related expenses recognized together in the same reporting period. Cost should be matched with the revenue generated.`],
["Disclosure Principle",`All relevant and material information should be recorded.\nrequires a business to report all necessary information about their financial statements and other revelation information to sny persons who are accustomed to reading this information.`,`Typos: "sny" = "any"; "revelation information" = "relevant information".`],
["Conservatism Principle",`General concept of recognizing expenses and liabilities as soon as possible when there is uncertainty about the outcome.\nBut to only recognize revenues and assets when they assured of being received. Also known as PRUDENCE.\nIn case of doubt, assets, and income should not be overstated while liabilities and expenses should not be understand.`,`Typo: "should not be understand" = "should not be understated".`],
["PRUDENCE",`Another name for the Conservatism Principle: recognize expenses and liabilities as soon as possible when there is uncertainty, but recognize revenues and assets only when assured of being received.`,`Added card (not in the original text) because the lesson says "Also known as PRUDENCE."`]]],
["LESSON 3 — FINANCIAL STATEMENTS","Financial Statements",[
["Financial Statements",`are written records that convey the business activities and financial performance.`],
["(Balance Sheet) Statement of Financial Position",`Summarizes a company's assets, liabilities and shareholders ' equity.`],
["Statement of Income",`Shows company's revenues, expenses, and profitability over a period of time.`],
["Statement in Changes in Equity",`also referred as statement of (retained earnings)`,`Standard name: Statement of Changes in Equity.`],
["Statement of Cash Flow",`cash inflows/cash outflows.`],
["CHART OF ACCOUNTS",`Is an index of all the financial accounts`],
["FIVE MAJOR ACCOUNTS",`Provide the structure for chart of accounts.`,`The five: Assets, Liabilities, Owner's Equity, Revenues (Income), Expenses.`]]],
["LESSON 3 — FINANCIAL STATEMENTS","ASSETS — Current Assets",[
["Assets",`Properties owned and controlled by the entity as result of past events and from which economic benefits are expected to flow.`],
["Current Assets",`short-term assets that a company expects to use up, convert into cash, or sell within fiscal year or operating cycle.`],
["Cash",`money on hand, or in banks, and other items considered as medium of exchange in business transactions.`],
["Accounts Receivable",`amounts due from customers arising from credit sales or credit services.`],
["Notes Receivable",`asset account tied to an underlying promissory note.\nPromissory note is a written promise by one party to make a payment of money at a date in the future.`],
["Inventories",`assets held for resale.`],
["Supplies",`items purchased by an enterprise.`],
["Prepaid expenses",`expenses paid in advance.`],
["Prepaid Rent",`lease payment made for a future period.`],
["Prepaid Insurance",`insurance that are paid in advance.`],
["Accrued Income",`revenue earned but not yet collected.`]]],
["LESSON 3 — FINANCIAL STATEMENTS","ASSETS — Non-current Assets",[
["Non-current Assets",`company's long term investments, more than a year.`],
["Property, Plant and Equipment",`Long-lived assets which have been acquired for use in operations. (Land, Buildings, Machinery)`],
["Intangible Assets",`identifiable non-monetary asset without physical substance.`],
["Accumulated Depreciation",`the total amount an asset has been depreciated up until a single point.`,`It is a contra-asset: it is deducted from the cost of the asset.`]]],
["LESSON 3 — FINANCIAL STATEMENTS","LIABILITIES — Current",[
["LIABILITIES",`Existing obligation of the entity arising from past events the settlement which is expected to result in outflow from the resources embodying economic benefits. (utang) (financial obligation)`],
["Current Liabilities",`are debts a company must pay within a normal operating cycle, less than 22 months`,`Correction: current liabilities are due within 12 months (or one operating cycle). "22" is likely a typo for "12".`],
["Accounts Payable",`are amounts due, or payable to, supplies for goods purchased on account or for services received on account.`,`Typo: "supplies" should be "suppliers".`],
["Notes Payable",`A promissory note issued by the business to its creditors for money borrowed or merchandise and other assets bought on credit.`],
["Unearned Income",`cash collected in advance; the liability id the services to be performed or goods to be delivered in the future.`,`Typo: "id" = "is".`],
["Accrued Expenses",`expenses that are incurred but not yet paid.`]]],
["LESSON 3 — FINANCIAL STATEMENTS","LIABILITIES — Non-current",[
["Non-current Liabilities",`are the debts a business owes bust isn't due to pay for at least 12 months.\nlong-term liabilities`,`Typo: "bust" = "but".`],
["Loans Payable",`secured by the entity's real estate property.`,`Clarification: loans payable are generally amounts borrowed; this wording describes a MORTGAGE PAYABLE.`,`Clue: borrowed money`],
["Mortgage Payable",`liability of a property owner to pay a loan that is secured by property.`]]],
["LESSON 3 — FINANCIAL STATEMENTS","OWNER'S EQUITY",[
["Owner's Equity",`Proportion of the total value of a company's assets that can be claimed by its owner.\nresidual interest of the owner from the business.`],
["Owner's Drawings",`account is credited (increase) for business' net profit and debited (decreased) for the net loss.`,`Correction: this describes the Income Summary / capital effect of profit or loss. Owner's Drawings are withdrawals of cash or assets by the owner for personal use; they are debited and DECREASE owner's equity.`,`Clue: owner's withdrawals`],
["Owner's Capital",`Value of cash and other assets contributed to the business by the owner of the business.`]]],
["LESSON 3 — FINANCIAL STATEMENTS","REVENUES (INCOME)",[
["REVENUES (INCOME)",`The money that is produced by carrying out normal business operations.\ntotal amount of money received from carrying out the business operation such as sales.`],
["Sales or Service Income",`Revenue or gross income from sale of company's products snd services.`,`Typo: "snd" = "and".`]]],
["LESSON 3 — FINANCIAL STATEMENTS","EXPENSES",[
["EXPENSES",`costs you incur while running your business.`],
["Cost of Sales or Services",`direct cost of the products sold or for the services by the entities.`],
["Salary Expense",`direct cost of the products sold or for services rendered by the entities.`,`Clarification: the original repeats the Cost of Sales definition. Salary Expense is the pay for employees' work.`,`Clue: employees' pay`],
["Utilities Expense",`Includes telephone, water and electricity use.`],
["Rent Expense",`Rental use of things owned by other entities.`],
["Supplies Expense",`Includes office supplies, warehouse supplies, medical, dental supplies used.`],
["Transportation Expense",`Fore for trips and travels.`,`Typo: "Fore" = "Fare".`],
["Depreciation Expense",`portion of the cost of building and equipment allocated to one accounting period.`],
["Interest Expense",`Interest on debts or monetary obligations.`]]]
];
// ===== MEMORY GUIDE (extra study aid) =====
const M=[["IDENTIFYING → RECORDING → COMMUNICATING","I-R-C: \"I Really Care\" — Identify the event, Record it, Communicate it."],
["Language vs Eyes of the Business","Language = talk (communication). Eyes = see (bookkeeping records)."],
["Clay Tablets / Pacioli","3600 B.C. = clay (earliest). 14th century = Pacioli, \"Father of Accounting\", Summa de Arithmetica."],
["Principles","\"BE GO TiMe OB CO AC MA DI CO\": Business Entity, Going Concern, Time period, Monetary unit, OBjectivity, COst, ACcrual, MAtching, DIsclosure, COnservatism."],
["Business Entity","Entity = a separate person. Owner's pocket ≠ business pocket."],
["Going Concern","The business keeps \"going\" — no plan to close."],
["Matching","Match the shoes (expenses) with the socks (revenue) in the same period."],
["Conservatism / Prudence","Pessimist for losses, realist for gains: record expenses early, income only when sure."],
["Cost Principle","Record what you PAID, not what it is worth now."],
["Financial statements","Balance Sheet = a photo (one date). Income Statement = a video (a period). Cash Flow = the wallet."],
["Five major accounts","A-L-O-R-E: Assets, Liabilities, Owner's equity, Revenues, Expenses."],
["Accounting equation","Assets = Liabilities + Owner's Equity."],
["Current vs Non-current","Current = within 12 months. Non-current = more than 12 months."],
["Receivable vs Payable","Receivable = they owe ME (asset). Payable = I owe THEM (liability)."],
["Prepaid vs Accrued","Prepaid = paid first, used later. Accrued = used first, paid later."],
["Unearned Income","Money is in, but the work is not done yet: you owe the service."],
["Owner's Capital vs Drawings","Capital = money put IN. Drawings = money taken OUT."],
["Accumulated Depreciation","Accumulated = total up to now; Depreciation Expense = the portion for one period."],
["Notes vs Mortgage","Note = a written promise to pay. Mortgage = a loan secured by property."]];
// ===== CORE =====
const $=s=>document.querySelector(s),sh=a=>{a=[...a];for(let i=a.length;i>1;){let j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),fmt=s=>esc(s).replace(/\n/g,'<br>');
const C=[];L.forEach((s,si)=>s[2].forEach(it=>C.push({t:it[0],d:it[1],n:it[2],c:it[3],s:si,id:C.length})));
let P={k:[],h:[],b:0,o:[]};try{P=Object.assign(P,JSON.parse(localStorage.getItem('abm')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('abm',JSON.stringify(P))}catch(e){}};
const V=[["home","🏠 Dashboard"],["rev","📖 Full Reviewer"],["fl","🃏 Flashcards"],["qz","📝 Quiz"],["mem","🧠 Memory Guide"]];
$('#nav').innerHTML=V.map(v=>`<button data-v="${v[0]}">${v[1]}</button>`).join('');
function show(v){document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));if(v=='home')home();scrollTo(0,0)}
$('#nav').onclick=e=>e.target.dataset.v&&show(e.target.dataset.v);
const pct=(a,b)=>b?Math.round(a/b*100):0;
function home(){const kp=pct(P.k.length,C.length);$('#home').innerHTML=`<div class="card"><h2 style="margin-top:0">Welcome, ABM student!</h2><p>Study the full lesson, flip flashcards (definition → term), then test yourself.</p>
<div class="grid"><div class="stat"><b>${P.k.length}/${C.length}</b>cards known</div><div class="stat"><b>${P.h.length}</b>difficult cards</div><div class="stat"><b>${P.b}%</b>best quiz score</div><div class="stat"><b>${P.o.length}/${L.length}</b>sections read</div></div>
<p class="muted">Flashcard mastery: ${kp}%</p><div class="bar"><i style="width:${kp}%"></i></div><br>
<button class="b" onclick="show('rev')">Full Reviewer</button><button class="b s" onclick="show('fl')">Flashcards</button><button class="b g" onclick="show('qz')">Quiz</button><button class="b o" onclick="resetP()">Reset Progress</button></div>`}
function resetP(){if(confirm('Reset all saved progress?')){P={k:[],h:[],b:0,o:[]};save();home();fl()}}
// ===== REVIEWER =====
(function(){let h='<div class="card">Tap a section to expand it. The original wording is never changed; corrections appear in a separate purple box.</div>',last='';
L.forEach((s,si)=>{if(s[0]!=last){h+=`<h3 class="l">${esc(s[0])}</h3>`;last=s[0]}
h+=`<details data-i="${si}"><summary>${esc(s[1])}</summary><div class="body">`+s[2].map(it=>`<div class="it"><b>${esc(it[0])}</b> — ${fmt(it[1])}${it[2]?`<div class="note"><b>Clarification (not part of the original):</b> ${esc(it[2])}</div>`:''}</div>`).join('')+`</div></details>`});
$('#rev').innerHTML=h;$('#rev').addEventListener('toggle',e=>{const i=+e.target.dataset.i;if(e.target.open&&!P.o.includes(i)){P.o.push(i);save()}},true)})();
// ===== FLASHCARDS =====
let F={d:[],i:0,f:0,mode:'all'};
function deck(){let m=F.mode;F.d=m=='all'?C.slice():m=='hard'?C.filter(c=>P.h.includes(c.id)):C.filter(c=>c.s==m);F.i=0;F.f=0}
function fl(){if(!F.d.length&&F.mode=='all')deck();const c=F.d[F.i];
$('#fl').innerHTML=`<div class="card"><select id="fm"><option value="all">All cards (${C.length})</option><option value="hard">Difficult cards only (${P.h.length})</option>${L.map((s,i)=>`<option value="${i}">${esc(s[1])}</option>`).join('')}</select></div>`+
(c?`<div class="card fc" id="fc"><small>${F.f?'ANSWER':'QUESTION'} — card ${F.i+1} of ${F.d.length} ${P.k.includes(c.id)?'✅':''}${P.h.includes(c.id)?'⚠️':''}</small>${F.f?`<div class="a">${esc(c.t).toUpperCase()}</div>`:`<div>${fmt(c.d)}${c.c?`<br><i class="muted">(${esc(c.c)})</i>`:''}</div><small style="margin-top:12px">Tap to reveal the term</small>`}</div>
<div class="bar"><i style="width:${pct(F.i+1,F.d.length)}%"></i></div><div style="margin-top:10px"><button class="b o" id="pv">◀ Previous</button><button class="b" id="sa">Show Answer</button><button class="b o" id="nx">Next ▶</button><br>
<button class="b g" id="kn">✔ Know It</button><button class="b r" id="ra">↻ Review Again</button><button class="b s" id="shf">Shuffle</button><button class="b o" id="rs">Restart</button></div>`:`<div class="card">No cards in this deck yet. Mark cards as "Review Again" to build your difficult deck.</div>`);
$('#fm').value=F.mode;$('#fm').onchange=e=>{F.mode=e.target.value;deck();fl()};
if(!c)return;const go=d=>{F.i=(F.i+d+F.d.length)%F.d.length;F.f=0;fl()};
$('#fc').onclick=$('#sa').onclick=()=>{F.f=!F.f;fl()};$('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
$('#shf').onclick=()=>{F.d=sh(F.d);F.i=0;F.f=0;fl()};$('#rs').onclick=()=>{deck();fl()};
$('#kn').onclick=()=>{P.h=P.h.filter(x=>x!=c.id);if(!P.k.includes(c.id))P.k.push(c.id);save();go(1)};
$('#ra').onclick=()=>{P.k=P.k.filter(x=>x!=c.id);if(!P.h.includes(c.id))P.h.push(c.id);save();go(1)}}
// ===== QUIZ =====
let Q={qs:[],i:0,res:[],sub:0};
const norm=s=>s.toLowerCase().replace(/\(.*?\)/g,'').replace(/[^a-z0-9]/g,'');
const chk=(a,t)=>{a=norm(a);t=norm(t);return a.length>2&&(a==t||(a.length>=5&&t.includes(a)&&a.length>=t.length*.6)||(t.length>=5&&a.includes(t)))};
function mk(ty,c){if(ty=='id')return{ty,c};
if(ty=='mc'){let o=C.filter(x=>x.id!=c.id&&x.t!=c.t),same=sh(o.filter(x=>x.s==c.s)),rest=sh(o.filter(x=>x.s!=c.s));return{ty,c,o:sh([c,...same.concat(rest).slice(0,3)])}}
let tr=Math.random()<.5,o=sh(C.filter(x=>x.id!=c.id&&x.d!=c.d))[0];return{ty:'tf',c,o,tr,shown:tr?c.d:o.d}}
function build(n,mode){let ts=sh(C),qs=[];while(qs.length<n&&ts.length){let ty=mode=='id'?'id':['id','mc','tf','mc','match'][qs.length%5];if(ty=='match'&&ts.length<4)ty='mc';
if(ty=='match'){let it=ts.splice(0,4);qs.push({ty,it,defs:sh(it)});continue}qs.push(mk(ty,ts.shift()))}return qs}
function qz(){$('#qz').innerHTML=`<div class="card"><h2 style="margin-top:0">Quiz setup</h2><p>Mode</p><select id="qm"><option value="mix">Mixed (identification, multiple choice, true/false, matching)</option><option value="id">Identification only (full definitions)</option></select><p>Number of questions</p>
${[10,20,30,'All'].map(n=>`<button class="b" data-n="${n}">${n=='All'?'All Questions':n}</button>`).join('')}</div>`;
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{let n=b.dataset.n=='All'?1e9:+b.dataset.n;Q={qs:build(n,$('#qm').value),i:0,res:[],sub:0,mode:$('#qm').value,n};ask()})}
function ask(){const q=Q.qs[Q.i];Q.sub=0;let h=`<div class="card"><div class="muted">Question ${Q.i+1} of ${Q.qs.length}</div><div class="bar"><i style="width:${pct(Q.i,Q.qs.length)}%"></i></div><br>`;
if(q.ty=='id')h+=`<b>Identification:</b><p>${fmt(q.c.d)}${q.c.c?` <i class="muted">(${esc(q.c.c)})</i>`:''}</p><input type="text" id="ans" placeholder="Type the accounting term" autocomplete="off">`;
if(q.ty=='mc')h+=`<b>Multiple choice — which term matches this definition?</b><p>${fmt(q.c.d)}${q.c.c?` <i class="muted">(${esc(q.c.c)})</i>`:''}</p>`+q.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join('');
if(q.ty=='tf')h+=`<b>True or False</b><p>“${esc(q.c.t)}” — ${fmt(q.shown)}</p><button class="opt" data-i="1">True</button><button class="opt" data-i="0">False</button>`;
if(q.ty=='match')h+=`<b>Matching — pick the letter of each term's complete definition</b>`+q.it.map((t,i)=>`<div class="mm"><span>${esc(t.t)}</span><select data-i="${i}"><option value="">?</option>${'ABCD'.split('').map(l=>`<option>${l}</option>`).join('')}</select></div>`).join('')+q.defs.map((d,i)=>`<div class="it"><b>${'ABCD'[i]}.</b> ${fmt(d.d)}</div>`).join('');
h+=`<div id="fb"></div><button class="b g" id="sub">Submit</button></div>`;$('#qz').innerHTML=h;let sel=null;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(Q.sub)return;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.i});
$('#sub').onclick=()=>{if(Q.sub)return Q.i+1<Q.qs.length?(Q.i++,ask()):fin();let ok=0,ex='',g='';
if(q.ty=='id'){g=$('#ans').value;if(!g.trim())return;ok=chk(g,q.c.t);ex=`Answer: <b>${esc(q.c.t)}</b> — ${fmt(q.c.d)}`}
if(q.ty=='mc'){if(sel==null)return;g=q.o[sel].t;ok=q.o[sel].id==q.c.id;ex=`Answer: <b>${esc(q.c.t)}</b> — ${fmt(q.c.d)}`;document.querySelectorAll('.opt').forEach((b,i)=>b.classList.add(q.o[i].id==q.c.id?'ok':(i==sel?'no':'')))}
if(q.ty=='tf'){if(sel==null)return;ok=!!sel==q.tr;g=sel?'True':'False';ex=q.tr?`True. This is the correct definition of <b>${esc(q.c.t)}</b>.`:`False. That definition belongs to <b>${esc(q.o.t)}</b>. <b>${esc(q.c.t)}</b> means: ${fmt(q.c.d)}`}
if(q.ty=='match'){let s=[...document.querySelectorAll('select[data-i]')];if(s.some(x=>!x.value))return;let r=s.filter((x,i)=>q.defs[x.value.charCodeAt(0)-65]==q.it[i]).length;ok=r==4;g=r+'/4 pairs';ex='Correct pairs: '+q.it.map(t=>`<b>${esc(t.t)}</b> = ${'ABCD'[q.defs.indexOf(t)]}`).join('; ')}
Q.sub=1;Q.res.push({q,ok,ex});$('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'✅ Correct!':'❌ Incorrect.'} ${ex}</div>`;$('#sub').textContent=Q.i+1<Q.qs.length?'Next question ▶':'See results'}}
function fin(){const r=Q.res,c=r.filter(x=>x.ok),w=r.filter(x=>!x.ok),p=pct(c.length,r.length);if(p>P.b&&Q.mode!='retry'){P.b=p;save()}
$('#qz').innerHTML=`<div class="card"><h2 style="margin-top:0">Results</h2><div class="grid"><div class="stat"><b>${c.length}/${r.length}</b>score</div><div class="stat"><b>${p}%</b>percentage</div><div class="stat"><b>${c.length}</b>correct</div><div class="stat"><b>${w.length}</b>incorrect</div></div><br>
${w.length?`<button class="b r" id="ri">Retry Incorrect Answers</button>`:'<p>🎉 Perfect score!</p>'}<button class="b" id="rt">Retake Quiz</button><button class="b o" id="bk">Quiz Menu</button></div>
${w.length?`<div class="card"><b>Review of incorrect answers</b>${w.map(x=>`<div class="it">${x.q.ty=='match'?'Matching set':fmt(x.q.c.d)}<div class="fb no">${x.ex}</div></div>`).join('')}</div>`:''}`;
if(w.length)$('#ri').onclick=()=>{Q={qs:w.map(x=>x.q),i:0,res:[],sub:0,mode:'retry'};ask()};
$('#rt').onclick=()=>{Q={qs:build(Q.n||1e9,Q.mode=='id'?'id':'mix'),i:0,res:[],sub:0,mode:Q.mode=='retry'?'mix':Q.mode,n:Q.n};ask()};$('#bk').onclick=qz}
// ===== MEMORY =====
$('#mem').innerHTML='<div class="card">Extra memory aids. These never replace the full definitions in the Full Reviewer.</div>'+M.map(m=>`<div class="card"><b style="color:var(--pr)">${esc(m[0])}</b><br>${esc(m[1])}</div>`).join('');
show('home');fl();qz();
</script></body></html>
